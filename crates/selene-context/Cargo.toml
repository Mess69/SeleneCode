[package]
name = "selene-context"
description = "Context assembly for AI consumption: relevance, explore, formatters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
selene-core = { path = "../selene-core" }
selene-db = { path = "../selene-db" }
selene-graph = { path = "../selene-graph" }
indexmap = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
regex = { workspace = true }
selene-extract = { path = "../selene-extract" }
selene-resolve = { path = "../selene-resolve" }
selene-db = { path = "../selene-db", features = ["kv-mem"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
# The perf probe installs a subscriber so `batch.rs`'s phase spans are actually rendered.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
