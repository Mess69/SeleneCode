reason = "selene-core is the foundation: no sibling imports"

[[boundaries]]
from = "selene-core/src/**"
to = "selene-mcp/src/**"
reason = "selene-core is the foundation: no sibling imports"

[[boundaries]]
from = "selene-core/src/**"
