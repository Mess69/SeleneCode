[package]
name = "selene-mcp"
description = "MCP server (rmcp): tools, transport, server-instructions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
selene-core = { path = "../selene-core" }
# ⚠ Cargo UNIFIES features across the dependency graph, so this line reaches into the
# `selene` binary and decides its storage engine from three crates away. That is how the
# deleted `kv-surrealkv` feature (46 nodes/s vs RocksDB's 706, Phase-1 gate) once silently
# became the whole product's backend. RocksDB is the sole disk backend now — if an
# alternate kv feature ever returns, never name it here.
selene-db = { path = "../selene-db", default-features = false, features = ["kv-rocksdb"] }
selene-graph = { path = "../selene-graph" }
selene-context = { path = "../selene-context" }
# Daemon-routed writes: the daemon owns the exclusive lock, so `sync` runs through it (against the
# warm store) rather than fighting for the lock. No cycle — selene-sync does not depend on us.
selene-sync = { path = "../selene-sync" }
# The local embedder, behind `semantic-search` — the daemon holds the model warm so query-time
# embedding costs ~8ms, not the ~3.6s model load. Off by default (no ONNX in a default build).
selene-embed = { workspace = true, optional = true }
# Task 1 (spike): the SDK the whole of Phase 5 rides on. Features pinned to what a
# stdio server needs — `server` (ServerHandler), `macros` (#[tool_router]/#[tool]),
# `transport-io` (stdio). NOT the http/sse transports: Phase 5 is stdio-only.
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Daemon (Phase 6): deterministic socket path from the project root, POSIX pid liveness.
sha2 = { workspace = true }
libc = { workspace = true }
anyhow = { workspace = true }
# The daemon's FileWatcher: auto-sync the warm store when source files change.
notify = { workspace = true }

[features]
# Semantic (vector) search over MCP: the server holds the embedder warm and `search`/`explore` fuse
# lexical + vector. Off by default so the MCP server compiles no ONNX runtime.
semantic-search = ["dep:selene-embed"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
# The `client` feature is TEST-ONLY: the spike (and Tasks 14-19) drive the server
# through a real in-memory client, which needs `RoleClient`/`serve_client`. The shipped
# binary is a server and must not carry the client half.
rmcp = { workspace = true, features = ["client"] }
selene-extract = { path = "../selene-extract" }
selene-resolve = { path = "../selene-resolve" }
serde_json = { workspace = true }
tempfile = { workspace = true }
# Task 20 dogfood gate: reads tests/fixtures/dogfood/questions.toml (read-only).
toml = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true
