[package]
name = "selene-mcp"
description = "MCP server (rmcp): tools, transport, server-instructions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
selene-core = { path = "../selene-core" }
# ⚠ NOT `kv-surrealkv`. Cargo UNIFIES features across the dependency graph, so this line
# reaches into the `selene` binary and decides its storage engine from three crates away —
# and `SurrealStore::open` prefers SurrealKV whenever it is compiled in (surreal.rs:93).
# SurrealKV measured **46 nodes/s vs RocksDB's 706** in the Phase-1 gate, which called it
# "pathologically slow on this write load" and made RocksDB the default. Naming it here
# silently overrode that default for the whole product.
selene-db = { path = "../selene-db", default-features = false, features = ["kv-rocksdb"] }
selene-graph = { path = "../selene-graph" }
selene-context = { path = "../selene-context" }
# Task 1 (spike): the SDK the whole of Phase 5 rides on. Features pinned to what a
# stdio server needs — `server` (ServerHandler), `macros` (#[tool_router]/#[tool]),
# `transport-io` (stdio). NOT the http/sse transports: Phase 5 is stdio-only.
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
# The `client` feature is TEST-ONLY: the spike (and Tasks 14-19) drive the server
# through a real in-memory client, which needs `RoleClient`/`serve_client`. The shipped
# binary is a server and must not carry the client half.
rmcp = { workspace = true, features = ["client"] }
selene-extract = { path = "../selene-extract" }
selene-resolve = { path = "../selene-resolve" }
serde_json = { workspace = true }
tempfile = { workspace = true }
# Task 20 dogfood gate: reads tests/fixtures/dogfood/questions.toml (read-only).
toml = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true
