[package]
name = "selene"
description = "SeleneCode CLI + MCP server (single static binary)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "selene"
path = "src/main.rs"

[dependencies]
selene-core.workspace = true
# ⚠ RocksDB, NOT SurrealKV — and the feature list is load-bearing, not a preference.
# `SurrealStore::open` prefers SurrealKV whenever `kv-surrealkv` is COMPILED IN
# (surreal.rs:93 vs :106), so naming it here silently forces the backend that the
# Phase-1 gate measured at **46 nodes/s vs RocksDB's 706** and called "pathologically
# slow on this write load" (docs/benchmarks/2026-07-phase1-db-gate.md:86-93). The binary
# shipped on the backend its own benchmark had already rejected, because nothing had ever
# RUN the binary. Do not add `kv-surrealkv` here to "have both" — compiling it IS choosing it.
selene-db = { path = "../selene-db", default-features = false, features = ["kv-rocksdb"] }
selene-extract = { path = "../selene-extract" }
selene-resolve = { path = "../selene-resolve" }
selene-mcp = { path = "../selene-mcp" }
selene-cli = { path = "../selene-cli" }
clap = { workspace = true, features = ["derive"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# `cargo build -p selene --features semantic-search` builds the semantic-capable binary (local ONNX
# embedder + hybrid vector search). The default build omits it entirely — lean, offline static binary.
semantic-search = ["selene-cli/semantic-search"]

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
# Daemon integration test: drive the real `selene serve --mcp` binary as an MCP server through a
# genuine rmcp client over a spawned child process (proxy → daemon → warm store, end to end).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time"] }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
