[package]
name = "selene"
description = "SeleneCode CLI + MCP server (single static binary)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "selene"
path = "src/main.rs"

[dependencies]
selene-core.workspace = true
selene-db = { path = "../selene-db", features = ["kv-surrealkv"] }
selene-extract = { path = "../selene-extract" }
selene-resolve = { path = "../selene-resolve" }
selene-mcp = { path = "../selene-mcp" }
clap = { workspace = true, features = ["derive"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
