[package]
name = "selene"
description = "SeleneCode CLI + MCP server (single static binary)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Prebuilt release binaries are the ONLY supported install channel.
# `cargo binstall` works off the dist release assets; the compile fallbacks are
# disabled because a crates.io build would silently drop the workspace [patch]
# (vendor/surrealdb) — the unpatched SDK ignores every SURREAL_* env cap.
[package.metadata.binstall]
disabled-strategies = ["quick-install", "compile"]

[[bin]]
name = "selene"
path = "src/main.rs"

[dependencies]
selene-core.workspace = true
# ⚠ RocksDB is the SOLE disk backend. The `kv-surrealkv` alternative was deleted
# (2026-07-19) after the Phase-1 gate measured it at 46 nodes/s vs RocksDB's 706
# (docs/benchmarks/2026-07-phase1-db-gate.md) — and after the binary once shipped on
# that rejected backend because compiling the feature in silently selected it. Do not
# re-add alternate kv features without a new gate; compiling one in IS choosing it.
selene-db = { path = "../selene-db", default-features = false, features = ["kv-rocksdb"] }
selene-extract = { path = "../selene-extract" }
selene-resolve = { path = "../selene-resolve" }
selene-mcp = { path = "../selene-mcp" }
selene-cli = { path = "../selene-cli" }
clap = { workspace = true, features = ["derive"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dependencies.dhat]
version = "0.3"
optional = true

[features]
# TEMP-DHAT: heap attribution at t-gmax (docs.rs/dhat)
dhat-heap = ["dep:dhat"]
# `cargo build -p selene --features semantic-search` builds the semantic-capable binary (local ONNX
# embedder + hybrid vector search). The default build omits it entirely — lean, offline static binary.
semantic-search = ["selene-cli/semantic-search"]

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
# Daemon integration test: drive the real `selene serve --mcp` binary as an MCP server through a
# genuine rmcp client over a spawned child process (proxy → daemon → warm store, end to end).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time"] }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
