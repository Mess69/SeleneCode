[package]
name = "selene-cli"
description = "The selene CLI: the 22-subcommand surface, dispatch, exit-code contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axoupdater.workspace = true
selene-core = { workspace = true }
selene-db = { path = "../selene-db", default-features = false, features = ["kv-rocksdb"] }
selene-extract = { path = "../selene-extract" }
# The shared graph-analysis algorithms (Louvain/Tarjan/betweenness) for viz+report.
selene-graph = { workspace = true }
selene-resolve = { path = "../selene-resolve" }
selene-sync = { path = "../selene-sync" }
selene-installer = { path = "../selene-installer" }
selene-mcp = { path = "../selene-mcp" }
# The local embedder — behind `semantic-search`, so a default build never compiles the ONNX runtime.
selene-embed = { workspace = true, optional = true }
# JSON serialization for `selene viz`'s graph export (safe escaping into the HTML).
serde_json = { workspace = true }
# GraphML writer for `selene export` — escaping handled by the library, never by hand.
quick-xml = { workspace = true }
# `selene diff <rev>` — read the tree at a revision without checkout (F4).
gix = { workspace = true }
# The rev-state corpus is materialized under a temp dir (never the worktree).
tempfile = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# Optional semantic (vector) search: pulls the local ONNX embedder. Off by default so the shipped
# static binary stays lean and fully offline. `selene embed` + hybrid search light up when it's on.
semantic-search = ["dep:selene-embed", "selene-mcp/semantic-search"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
