# SeleneCode — local-first code intelligence, in Rust.
#
# Workspace root. This scaffold operationalizes the target architecture in
# docs/specs/2026-07-11-rust-graph-db-migration-design.md (the PRD); build order
# and locked decisions live in docs/plans/2026-07-12-selenecode-roadmap.md.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["SeleneCode contributors"]
repository = "https://github.com/CHANGE-ME/SeleneCode"

[workspace.dependencies]
# --- Intra-workspace crates (path deps) ---
selene-core      = { path = "crates/selene-core" }
selene-db        = { path = "crates/selene-db" }
selene-extract   = { path = "crates/selene-extract" }
selene-resolve   = { path = "crates/selene-resolve" }
selene-graph     = { path = "crates/selene-graph" }
selene-context   = { path = "crates/selene-context" }
selene-mcp       = { path = "crates/selene-mcp" }
selene-sync      = { path = "crates/selene-sync" }
selene-installer = { path = "crates/selene-installer" }
selene-cli       = { path = "crates/selene-cli" }

# --- Shared third-party deps ---
# Declared centrally; each crate opts in with `dep.workspace = true`. Cargo does
# NOT fetch entries no crate references, so the heavier ones below sit here as
# documented intent until a crate adopts them. Versions follow
# docs/reference/rust-ecosystem-2026-07.md (verified 2026-07-12); grammar crates
# are pinned exact (=x.y.z) below (Phase 2 Task 1), adopted by selene-extract.
serde        = { version = "1", features = ["derive"] }
serde_json   = { version = "1", features = ["preserve_order"] }
thiserror    = "2"
anyhow       = "1"
sha2         = "0.10"
# POSIX pid liveness (`kill(pid, 0)`) and `getppid()` for the daemon lifecycle. std has
# `process::id()` but no liveness check or parent pid. Tiny, ubiquitous, no build cost.
libc         = "0.2"
# Local text embeddings for OPTIONAL semantic search (feature `semantic-search`, off by default).
# Pulls the native ONNX runtime (`ort`) + downloads a small model once — so it is behind a feature
# to keep the default build a lean static binary. BGE-small-en-v1.5 = 384-d, runs offline on CPU.
fastembed    = "5"
selene-embed = { path = "crates/selene-embed" }
# Ordered map: preserves traversal/visit order (e.g. `Subgraph.nodes`) where a
# plain HashMap would not — the Rust analog of the CodeGraph TS traverser's
# reliance on `Map` insertion order (see
# docs/reference/from-codegraph/maps/db-graph-search.md "Rust port notes").
indexmap     = { version = "2", features = ["serde"] }
# Async runtime (surrealdb + rmcp are tokio-based); rayon handles data-parallel
# parsing and must never run on tokio worker threads (bridge via spawn_blocking).
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "io-std", "net", "process", "signal"] }
# `FutureExt::catch_unwind` — a synthesizer pass that panics must contribute zero
# edges and never fail the index (errors collected, never thrown). std's
# `catch_unwind` cannot wrap a future across await points; this can.
futures      = "0.3"
rayon        = "1"
# Parsing / extraction  (PRD §3: selene-extract)
tree-sitter  = "0.26"
# Scan pipeline (Phase 2 Tasks 16-17): gitignore-semantics matching for
# ScopeIgnore (the `ignore` crate is ripgrep's battle-tested matcher), and
# child-process wait with a deadline for the git fast path's bounded `git`
# invocations (std::process has no timeout of its own).
ignore       = "0.4"
wait-timeout = "0.2"
# No §-pin in rust-ecosystem-2026-07.md; current stable major, house style
# for non-contract deps. Used by detection sniffers + generated-file
# classifier (Task 3) and the C/C++ pre-parse blankers (Task 12).
regex        = "1"
# Resolution (Phase 3). None of these three are in the roadmap's pins table —
# added at the Phase 3 Task 1 spike, which measured/justified each:
#   fancy-regex — the ONLY reason: the `regex` crate has no lookaround, and the
#     receiver-inference tables need one negative lookahead (Lua/Luau #1124,
#     `(?![\w.]|\s*[({"'\[])`). Every other resolver pattern stays on `regex`.
#   lru — the LRUCache port (maps/resolution.md §Caches): insertion-ordered,
#     `get` refreshes recency, `put` evicts oldest — the TS semantics exactly.
#   json5 — tsconfig/jsconfig JSONC tolerance (comments + trailing commas).
#     Weaker tolerance than TS's `stripJsonc` means aliases silently vanish and
#     every aliased import regresses to unresolved, so the spike gates it.
fancy-regex  = "0.16"
lru          = "0.16"
json5        = "0.4"
# Structured diagnostics. Adopted at Phase 3 for the ONE thing that must never be
# silent: a store read that fails mid-resolution. Without it, a store outage is
# byte-identical to a clean no-match — nothing resolves and nothing says why,
# which is the vacuous-resolution failure the Phase 3 gate exists to catch.
# A `warn!` with no subscriber installed is a no-op, so this costs nothing until
# a surface (CLI/MCP) installs one.
tracing      = "0.1"
# ...and until something installs one, `selene-resolve::batch`'s phase timings are emitted
# into the void — which is exactly how a ~1 s/file resolution cost survived three phases
# unmeasured. The surfaces (CLI/MCP) install one; so does the perf probe.
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# v0 grammar crates — pinned EXACT (=x.y.z) per rust-ecosystem-2026-07.md §3:
# node-type names are extraction contracts, so a silent grammar bump would
# drift every language config. Only selene-extract opts in. All depend on
# `tree-sitter-language` (LanguageFn) at runtime, not on a core version, so
# they load on core 0.26 (ABI 13–15). kotlin uses the -ng lineage (the legacy
# tree-sitter-kotlin crate pins core <0.23 — dead end, §3).
tree-sitter-typescript = "=0.23.2"   # TS + TSX (one crate, two LanguageFns)
tree-sitter-javascript = "=0.25.0"
tree-sitter-python     = "=0.25.0"
tree-sitter-rust       = "=0.24.2"
tree-sitter-go         = "=0.25.0"
tree-sitter-java       = "=0.23.5"
tree-sitter-kotlin-ng  = "=1.1.0"
tree-sitter-c          = "=0.24.2"
tree-sitter-cpp        = "=0.23.4"
tree-sitter-c-sharp    = "=0.23.5"
tree-sitter-php        = "=0.24.2"   # use the `php` fn (mixed HTML/PHP), not `php_only`
tree-sitter-ruby       = "=0.23.1"
# Storage + search  (PRD §5): SurrealDB embedded behind the GraphStore trait.
# Decision 2026-07-12: sole backend, SurrealQL-max, no permissive fallback.
# kv backends (kv-surrealkv / kv-rocksdb) are selected by selene-db features.
# `allocator` = mimalloc on aarch64 / jemalloc on x86 (surrealdb-core `src/mem/mod.rs`). SurrealDB's
# own guidance for the embedded Rust engine asks for it — "using the correct memory allocator can
# greatly improve the performance of the database core engine" — and it is NOT on by default, so a
# `default-features = false` dependency (ours) never gets it. Measured on django: ladder 8.6 s ->
# 6.6 s, persist 8.4 s -> 7.3 s, total 31.5 s -> 28.9 s. Graph byte-identical.
#
# The same page recommends two things we tested and REJECTED, and one we must never take:
#   - `lto = true` (fat): NO measurable gain (28.86 s vs 28.90 s) and >10 min build. Kept `thin`.
#   - a hand-built tokio runtime with a 10 MiB stack: no gain (30.5 s vs 28.9 s).
#   - ⛔ `panic = 'abort'`: `selene-resolve` wraps the framework detectors and the synthesizers in
#     `catch_unwind` — a panicking resolver is a COLLECTED ERROR, not a dead index. Abort turns
#     every one of those into a crash.
surrealdb    = { version = "3.2", default-features = false, features = ["allocator"] }
# Surfaces / infra
clap         = { version = "4", features = ["derive"] }
rmcp         = { version = "2.2", default-features = false }  # official Rust MCP SDK
# JSON-Schema derive for tool input schemas. rmcp 2.2 re-exports schemars and its
# derives must match the version rmcp itself links (spike Task 1: schemars 1.x).
schemars     = "1"
notify       = "8"            # cross-platform file watching (FSEvents/inotify/RDCW)
toml_edit    = "0.25"
jsonc-parser = "0.33"
indicatif    = "0.18"
crossterm    = "0.29"
# Dev
tempfile     = "3"
insta        = "1"
# Parity gate (Task 19): reads tests/fixtures/parity/deviations.toml. Read-only
# deserialization, so the plain `toml` reader rather than `toml_edit`.
toml         = "0.9"

# Inherited by every crate via `[lints] workspace = true`. CI denies warnings;
# tests may locally `#![allow(clippy::unwrap_used, clippy::expect_used)]`.
[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"
rust-2018-idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
